name: CI

on:
  push:
    branches: [main]
    paths-ignore: ["website/**", "**.md"]
  pull_request:
    paths-ignore: ["website/**", "**.md"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    name: Windows (x64, tests)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      # Uses whichever Visual Studio the runner has (the presets name VS 2026 exactly).
      - name: Build and test
        shell: pwsh
        run: ./tools/ci/Build-Arch.ps1 -Arch x64

  android:
    name: Android (build, unit tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install SDK packages
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "ndk;28.2.13676358" "cmake;3.31.6" > /dev/null
      - name: Build and test
        working-directory: android
        run: bash ./gradlew --no-daemon assembleDebug testDebugUnitTest
      - uses: actions/upload-artifact@v4
        with:
          name: july-bangla-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

  linux:
    name: Linux (IBus engine, tests, .deb)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libibus-1.0-dev ninja-build
      - name: Build and test
        run: |
          cmake -S linux -B build-linux -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build-linux
          ctest --test-dir build-linux --output-on-failure
      - name: Package
        run: cd build-linux && cpack --config CPackConfig.cmake
      - uses: actions/upload-artifact@v4
        with:
          name: july-bangla-linux-deb
          path: build-linux/JulyBanglaKeyboard-linux-amd64.deb
